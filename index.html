<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Condiciones socioeconómicas de escuelas secundarias seleccionadas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <meta http-equiv="Cache-Control" content="no-store" />
    <link rel="stylesheet" href="styles.css?v=20260605-v5" />
  </head>
  <body>
    <main id="cesiumContainer" aria-label="Visor 3D de condiciones socioeconómicas"></main>
    <div id="loading" class="loading">
      <strong id="loadingPercent">0%</strong>
      <i><b id="loadingBar"></b></i>
    </div>

    <aside class="panel panel-left">
      <header>
        <p class="eyebrow">General San Martin</p>
        <h1>Condiciones socioeconómicas de las escuelas secundarias seleccionadas</h1>
        <p class="subtitle">Escala continua calibrada por percentiles de NBI.</p>
      </header>

      <section class="metric-grid" aria-label="Resumen">
        <div>
          <span>Total radios</span>
          <strong id="totalFeatures">524</strong>
        </div>
        <div>
          <span>NBI max.</span>
          <strong id="maxNbi">--</strong>
        </div>
        <div>
          <span>Hogares NBI</span>
          <strong id="totalNbiHomes">--</strong>
        </div>
        <div>
          <span>Poblacion</span>
          <strong id="totalPopulation">--</strong>
        </div>
      </section>

      <section class="legend" aria-label="Referencias">
        <div class="gradient-title">NBI (INDEC, 2022)</div>
        <div class="gradient-key" aria-hidden="true"></div>
        <div class="gradient-labels">
          <span>menor</span>
          <span>medio</span>
          <span>mayor</span>
        </div>
        <div class="school-dist" aria-label="Distribución de matrícula por quintil NBI">
          <div class="dist-row">
            <span class="dist-name walsh-name">Walsh</span>
            <div class="dist-bar">
              <span class="dist-seg" data-q="1" id="seg-walsh-1" title=""></span>
              <span class="dist-seg" data-q="2" id="seg-walsh-2" title=""></span>
              <span class="dist-seg" data-q="3" id="seg-walsh-3" title=""></span>
              <span class="dist-seg" data-q="4" id="seg-walsh-4" title=""></span>
              <span class="dist-seg" data-q="5" id="seg-walsh-5" title=""></span>
            </div>
          </div>
          <div class="dist-row">
            <span class="dist-name galeano-name">Galeano</span>
            <div class="dist-bar">
              <span class="dist-seg" data-q="1" id="seg-galeano-1" title=""></span>
              <span class="dist-seg" data-q="2" id="seg-galeano-2" title=""></span>
              <span class="dist-seg" data-q="3" id="seg-galeano-3" title=""></span>
              <span class="dist-seg" data-q="4" id="seg-galeano-4" title=""></span>
              <span class="dist-seg" data-q="5" id="seg-galeano-5" title=""></span>
            </div>
          </div>
          <div class="dist-row">
            <span class="dist-name pizarnik-name">Pizarnik</span>
            <div class="dist-bar">
              <span class="dist-seg" data-q="1" id="seg-pizarnik-1" title=""></span>
              <span class="dist-seg" data-q="2" id="seg-pizarnik-2" title=""></span>
              <span class="dist-seg" data-q="3" id="seg-pizarnik-3" title=""></span>
              <span class="dist-seg" data-q="4" id="seg-pizarnik-4" title=""></span>
              <span class="dist-seg" data-q="5" id="seg-pizarnik-5" title=""></span>
            </div>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="Controles">
        <div class="viewer-links" aria-label="Otros mapas">
          <button id="isochronesLink" type="button">Mapa de isochronas</button>
          <button id="heatmapLink" type="button">Mapa de calor</button>
        </div>
      </section>
    </aside>

    <div id="hoverTip" class="hover-tip" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
    <script src="app.js?v=20260605-v5"></script>
  </body>
</html>
